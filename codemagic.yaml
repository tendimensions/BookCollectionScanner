  default-workflow:
    name: Default Workflow
    max_build_duration: 25
    instance_type: mac_mini_m1
    working_directory: mobile   # Flutter project lives in mobile/
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_NAME: "Book Collection Scanner"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --release --build-number="$PROJECT_BUILD_NUMBER"
      - name: Build iOS IPA
        script: flutter build ipa --release --build-number="$PROJECT_BUILD_NUMBER"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - jason@tendimensions.com

